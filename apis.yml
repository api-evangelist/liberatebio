aid: liberatebio
name: Liberate Bio
description: Liberate Bio is a genetic medicine company developing in vivo cell therapies that reach
  cell populations beyond the liver, the long-standing limit of lipid nanoparticle delivery. Its RAPTOR
  discovery platform is a scalable in vivo screening system that identifies LNP delivery vehicles which
  work with existing biology to carry genetic payloads into immune cells in blood, bone marrow, and the
  spleen. Liberate Bio applies that delivery capability to in vivo CAR-M (chimeric antigen receptor
  macrophage) programs, reprogramming monocytes and macrophages to eliminate disease-driving cells
  without ex vivo manipulation, with programs in hematologic oncology and in autoimmune disease via
  depletion of pathogenic B-cell populations. Founded by Nessan Bermingham, Theresa M. Reineke, and
  Michael Mitchell, and led by CEO Shawn Davis and CSO Walter Strapps, the company raised $31M from
  Khosla Ventures in October 2025. It is pre-clinical and publishes no public API or developer surface.
